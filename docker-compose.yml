services:
  db:
    image: postgres:16-alpine
    container_name: jlturismo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jlturismo
    ports:
      - "5432:5432"
    volumes:
      - jlturismo_pgdata:/var/lib/postgresql/data
      - ./server/sql/001_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/sql/002_seed_destinos.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./server/sql/003_seed_admin.sql:/docker-entrypoint-initdb.d/03-seed-admin.sql:ro
      - ./server/sql/004_pagamentos.sql:/docker-entrypoint-initdb.d/04-pagamentos.sql:ro
      - ./server/sql/005_contatos.sql:/docker-entrypoint-initdb.d/05-contatos.sql:ro
      - ./server/sql/006_avaliacoes.sql:/docker-entrypoint-initdb.d/06-avaliacoes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jlturismo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jlturismo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/jlturismo
      - JWT_SECRET=super-secret-key-jlturismo-dev-123
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jlturismo-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  jlturismo_pgdata:

